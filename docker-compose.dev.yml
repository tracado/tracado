# ══ Override de DESENVOLVIMENTO ══
#
# Constrói o portal a partir do repositório privado clonado ao lado, em vez de
# puxar a imagem publicada. Uso:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# Espera a seguinte disposição:
#   ~/lastro/           (este repositório, público)
#   ~/lastro-portal/    (privado — o código do portal)
#
# Ajuste PORTAL_SRC no .env se o clone estiver em outro lugar.
services:
  sgsi-portal:
    build:
      context: ${PORTAL_SRC:-../lastro-portal}
      args:
        VERSION: dev
        GIT_SHA: local
        BUILD_ID: dev
    image: lastro-portal:dev
